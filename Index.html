<style>

.drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;padding:28px 16px;border:2px dashed rgba(37,217,245,.45);border-radius:12px;background:rgba(37,217,245,.05);cursor:pointer;color:var(--ink)}
.drop span{color:var(--ink2);font-size:12.5px}.drop:hover,.drop.on{background:rgba(37,217,245,.14);box-shadow:0 0 22px rgba(37,217,245,.25)}

<div class="app">

<script>
/* Motor de cruce: PDT x visitas x módulos -> dataset del dashboard. Recibe filas ya leídas del Excel (objetos por encabezado). */

/* Lectura robusta de encabezados de fecha y filas desde una matriz (aoa) */
const isoOfSerial=s=>new Date(Math.round((s-25569)*86400000)).toISOString().slice(0,10);
function normHeader(h){
  if(h===null||h===undefined)return '';
  if(typeof h==='number'&&h>30000&&h<80000)return isoOfSerial(h);
  if(h instanceof Date)return h.toISOString().slice(0,10);
  const t=String(h).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);
  const m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){const y=m[3].length==2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  return t;
}
function rowsFromAoa(aoa){
  if(!aoa.length)return [];
  const hdr=aoa[0].map(normHeader),out=[];
  for(let i=1;i<aoa.length;i++){const r=aoa[i],o={};let any=false;
    for(let c=0;c<hdr.length;c++){const v=r[c];if(hdr[c]&&v!==null&&v!==undefined&&v!==''){o[hdr[c]]=v;any=true}}
    if(any)out.push(o)}
  return out;
}
function buildDataset(inp){
  const {pdt,vis,fac,ren,tp}=inp;
  const ISO=ms=>new Date(ms).toISOString();
  const serialMs=s=>Math.round((s-25569)*86400000);
  const dayIso=s=>ISO(serialMs(Math.floor(s)*1)).slice(0,10);
  const clean=s=>String(s).replace(/^PG\d+\|/,'').trim();
  const rutaOf=(name,re)=>{const m=String(name||'').match(re);return m?'RUTA '+m[1]:null};
  const reV=/MR_(?:BK_)?(\d+)/i;
  if(!pdt.length)throw new Error('La hoja del PDT está vacía.');
  const dcs=new Set();for(const r of pdt)for(const k in r)if(/^\d{4}-\d{2}-\d{2}$/.test(k))dcs.add(k);const dateCols=[...dcs].sort();
  if(!dateCols.length)throw new Error('No encontré columnas de fecha (AAAA-MM-DD) en la hoja del PDT.');
  const ym=dateCols[0].slice(0,7),Y=+ym.slice(0,4),M=+ym.slice(5,7);
  const dayOf=iso=>+iso.slice(8,10);
  const routeSpoc={},routeNames={};
  for(const r of pdt){const ru=r['RUTA NUEVA'];if(!ru)continue;
    if(!(ru in routeSpoc)){routeSpoc[ru]=r['SPOC ASIGNADO'];routeNames[ru]=[]}
    const n=r['NOMBRE'];if(n&&!routeNames[ru].includes(n))routeNames[ru].push(n)}
  const routes=Object.keys(routeSpoc).sort(),spocs=[...new Set(Object.values(routeSpoc))].sort();
  const ridx=Object.fromEntries(routes.map((r,i)=>[r,i]));
  // plan
  const plan=[],vac=[];let vacRows=0;const vacRoutes=new Set();
  const nameByAcc={},canalByAcc={},storeByAcc={},storeNm={};
  for(const r of pdt){const ru=r['RUTA NUEVA'];if(!ru)continue;const acc=typeof r['ID RETAILX']==='string'&&r['ID RETAILX']?r['ID RETAILX']:null;
    if(acc&&!(acc in nameByAcc))nameByAcc[acc]=r['PDV'];
    if(acc&&!(acc in storeByAcc)){const dt=String(r['Determinante Cadena']===undefined?'':r['Determinante Cadena']).trim(),cd=String(r['Cadena ']||r['Cadena']||'').trim().toUpperCase();storeByAcc[acc]=dt&&dt!=='0'?cd+'#'+dt:'N#'+String(r['PDV']||acc).trim().toUpperCase();storeNm[acc]='N#'+String(r['PDV']||acc).replace(/^PG\d+\|/,'').trim().toUpperCase()}
    if(acc&&!(acc in canalByAcc)&&r['CANAL'])canalByAcc[acc]=String(r['CANAL']).trim().toUpperCase();
    for(const dc of dateCols){const v=r[dc];if(v===undefined||v===null||v==='')continue;
      if(v===1||String(v).trim()==='1')plan.push({ru,acc,pdv:r['PDV'],date:dc});
      else if(String(v).toLowerCase()==='v'){vacRows++;vacRoutes.add(ru)}}}
  // módulos
  const facSet=new Set(fac.map(r=>r['Visit ID'])),renSet=new Set(ren.map(r=>r['Visit ID']));
  const appR=new Set(ren.map(r=>r['Account ID'])),appT=new Set(tp.map(r=>r['Store ID']));
  const tpKeys=new Set();let modMax=0;
  for(const r of tp){const ru=rutaOf(r['Visitor Name'],reV);if(typeof r['Date']==='number'){modMax=Math.max(modMax,r['Date']);if(ru)tpKeys.add(ru+'|'+r['Store ID']+'|'+dayIso(r['Date']))}}
  for(const r of fac)if(typeof r['Date']==='number')modMax=Math.max(modMax,r['Date']);
  for(const r of ren)if(typeof r['Date']==='number')modMax=Math.max(modMax,r['Date']);
  // visitas (solo del mes del PDT)
  const SH=(inp.tzShift===undefined?6:inp.tzShift)/24;
  const visits=[];let visMax=0;
  // las horas del monitor vienen adelantadas: se restan para hora local
  for(const r of vis){const ru=rutaOf(r['Visitor Name'],reV),s0=r['PG_RetXCore__ActualStartTime__c'],s=typeof s0==='number'?s0-SH:s0,acc=r['PG_RetXCore__AccountId__c'];
    if(!ru||typeof s!=='number'||!acc)continue;const date=dayIso(s);if(date.slice(0,7)!==ym)continue;
    visMax=Math.max(visMax,s);
    const ci=typeof r['PG_RetXCore__PlannedStartTime__c']==='number'?r['PG_RetXCore__PlannedStartTime__c']-SH:s,co0=r['PG_RetXCore__ActualEndTime__c'],co=typeof co0==='number'?co0-SH:co0;
    let hrs=r['Actual_Hours__c'];if(typeof hrs!=='number')hrs=typeof co==='number'?(co-s)*24:null;
    const bk=/MR_BK_/i.test(String(r['Visitor Name']));
    visits.push({ci,co:typeof co==='number'?co:null,hrs,st:String(r['PG_RetXCore__Status__c']||''),bk,vn:String(r['Visitor Name']||'').trim(),id:r['Id'],ru,acc,date,company:r['CompanyName']||'',F:facSet.has(r['Id'])?1:0,R:renSet.has(r['Id'])?1:0,T:tpKeys.has(ru+'|'+acc+'|'+date)?1:0})}
  const vmap=new Map(visits.map(v=>[v.ru+'|'+v.acc+'|'+v.date,v]));
  const planKeys=new Set(plan.filter(p=>p.acc).map(p=>p.ru+'|'+p.acc+'|'+p.date)),planRA=new Set(plan.filter(p=>p.acc).map(p=>p.ru+'|'+p.acc));
  const extras=visits.filter(v=>!planKeys.has(v.ru+'|'+v.acc+'|'+v.date)),extraRA=new Set(extras.map(v=>v.ru+'|'+v.acc));
  const pdvs=[],pi=new Map();const pid=n=>{n=clean(n);if(!pi.has(n)){pi.set(n,pdvs.length);pdvs.push(n)}return pi.get(n)};
  const ev=[];
  for(const p of plan){const v=p.acc?vmap.get(p.ru+'|'+p.acc+'|'+p.date):null;let ok=0,F=0,R=0,T=0,rs=0;
    if(v){ok=1;F=v.F;R=v.R;T=v.T}else rs=!p.acc?2:(extraRA.has(p.ru+'|'+p.acc)?3:1);

const S={cut:D.meta.lastData,spoc:-1,ruta:-1,mode:'app',meta:100,tab:'res',onlyLow:true,sort:'pct',dq:'',dst:'all',dmax:150,qt:0,qmax:200,sdias:'lv'};

const evl=e=>e.day<=D.meta.modLast;
const COL={good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)',acc:'var(--cyan)'};

function pend(e){const p=[];
  if(!e.F)p.push('F');
  if(!e.R&&(S.mode==='all'||e.aR))p.push('R');
  if(!e.T&&(S.mode==='all'||e.aT))p.push('T');return p}
function status(e){
  if(e.just)return ['just','Justificada','good',e.just];
  if(e.t==1)return ['fuera','Fuera de PDT','warn',e.rs==4?'PDV de la ruta, otra fecha':'PDV no programado en la ruta'];
  if(e.ok){if(!evl(e))return ['sinmod','Adherente, módulos sin cargar','neutral',''];
    return pend(e).length?['incompleta','Adherente, faltan módulos','warn','']:['efectiva','Efectiva','good',''];}
  if(e.rs==2)return ['sinid','Sin ID de cuenta','neutral','No se puede validar'];
  return ['noreal','No realizada','bad',e.rs==3?'Visitado en otra fecha':''];
}
const sem=p=>p>=S.meta?['good','En meta','●']:p>=S.meta-10?['warn','Atención','▲']:['bad','Rezago','■'];
const pill=(c,l,i)=>`<span class="pill ${c}"><span aria-hidden="true">${i}</span>${l}</span>`;

function newR(){return {prog:0,ok:0,okE:0,nr:0,sinid:0,otra:0,xd:0,xf:0,eff:0,pF:0,pR:0,pT:0,qF:0,qR:0,qT:0,pm:0,pdvSin:0}}
function inSel(ru){const r=D.routes[ru];return (S.spoc<0||r[1]==S.spoc)&&(S.ruta<0||ru==S.ruta)}
function compute(){
  const R=D.routes.map(()=>newR()),pd=new Map(),daily={},rd={};
  for(const e of EV){
    const r=R[e.ru];
    if(e.t==0){
      r.pm++;
      if(e.day>S.cut)continue;
      r.prog++;
      const k=e.ru+'|'+e.pdv,o=pd.get(k)||{ru:e.ru,p:0,o:0};o.p++;o.o+=e.ok;pd.set(k,o);
      const h=(rd[e.ru]||(rd[e.ru]={}))[e.day]||(rd[e.ru][e.day]={p:0,o:0});h.p++;h.o+=e.ok;
      const dd=daily[e.day]||(daily[e.day]={p:0,o:0,e:0});
      if(inSel(e.ru)){dd.p++;dd.o+=e.ok}
      if(e.ok){r.ok++;
        if(evl(e)&&!e.just){r.okE++;const p=pend(e);if(!p.length){r.eff++;if(inSel(e.ru))dd.e++}
          r.qF++;r.qR+=(S.mode==='all'||e.aR)?1:0;r.qT+=(S.mode==='all'||e.aT)?1:0;
          if(p.includes('F'))r.pF++;if(p.includes('R'))r.pR++;if(p.includes('T'))r.pT++;}
      }else if(e.rs==2)r.sinid++;else{r.nr++;if(e.rs==3)r.otra++}
    }else if(e.day<=S.cut){if(e.rs==4)r.xd++;else r.xf++}
  }
  for(const o of pd.values())if(o.o==0)R[o.ru].pdvSin++;
  return {R,daily,rd};
}

/* ---------- componentes visuales ---------- */
function bar(frac,cls,pace,goal){
  return `<div class="pb" role="img" aria-label="${(frac*100).toFixed(0)}%"><div class="pb-fill ${cls}" style="width:${Math.min(100,frac*100)}%"></div>`+
   (pace!=null?`<i class="pace" style="left:${Math.min(100,pace*100)}%" data-tip="Ritmo esperado a la fecha: ${(pace*100).toFixed(1)}% del mes"></i>`:'')+
   (goal!=null?`<i style="left:${Math.min(100,goal*100)}%" data-tip="Objetivo: ${(goal*100).toFixed(0)}%"></i>`:'')+`</div>`;
}
function ring(p,col,goal,pace,big,small,size=170){
  const r=64,C2=2*Math.PI*r,v=Math.max(0,Math.min(100,p));
  const tick=(f,c,w)=>{const a=f/100*2*Math.PI-Math.PI/2,x1=85+(r-12)*Math.cos(a),y1=85+(r-12)*Math.sin(a),x2=85+(r+12)*Math.cos(a),y2=85+(r+12)*Math.sin(a);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  return `<svg viewBox="0 0 170 170" width="${size}" height="${size}" role="img" aria-label="${big}">
   <circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--track)" stroke-width="14"/>
   <circle class="glow" style="color:${col}" cx="85" cy="85" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C2*v/100} ${C2}" transform="rotate(-90 85 85)"/>
   ${pace!=null?tick(pace,'#a58bff',3):''}${goal!=null?tick(goal,'#ffffff',3):''}
   <text x="85" y="${small?88:96}" text-anchor="middle" style="fill:var(--ink);font-family:var(--display);font-size:30px;font-weight:700">${big}</text>
   ${small?`<text x="85" y="108" text-anchor="middle" style="font-size:10.5px">${small}</text>`:''}</svg>`;
}
function spark(vals,col){
  if(vals.length<2)return '';const mx=Math.max(...vals,1),mn=Math.min(...vals,0);
  const pts=vals.map((v,i)=>[i/(vals.length-1)*100,32-(v-mn)/(mx-mn||1)*28]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,34 ${line} 100,34" fill="url(#gArea)" style="opacity:.8"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke" class="glow" style="color:${col}"/></svg>`;
}
function hbar(label,frac,cls,val,goal,pace,tip){
  return `<div class="hbar" ${tip?`data-tip="${tip}"`:''}><span class="k" title="${esc(label)}">${esc(label)}</span>${bar(frac,cls,pace,goal)}<span class="vv num tc-${cls=='acc'?'':cls}">${val}</span></div>`;
}
function svgBars(daily){
  const days=Object.keys(daily).map(Number).sort((a,b)=>a-b);
  const W=640,H=200,L=34,B=22,T=24,Rr=8,pw=W-L-Rr,ph=H-B-T;
  const mx=Math.max(10,...days.map(d=>daily[d].p)),step=Math.ceil(mx/4/10)*10,top=step*4,bw=pw/days.length;let g='';
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="rgba(130,150,230,.16)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${step*i}</text>`}
  days.forEach((d,i)=>{const a=daily[d],w=Math.min(15,bw*.36),cx=L+i*bw+bw/2,hp=ph*a.p/top,ho=ph*a.o/top;
    const tip=`${dlab(d)}: ${a.p} programadas, ${a.o} con adherencia (${pc(a.o,a.p)})`;
    g+=`<rect x="${cx-w-1}" y="${T+ph-hp}" width="${w}" height="${hp}" rx="3" fill="url(#gGrey)" data-tip="${tip}"/>`+
       `<rect class="glow" style="color:#25d9f5" x="${cx+1}" y="${T+ph-ho}" width="${w}" height="${ho}" rx="3" fill="url(#gBlue)" data-tip="${tip}"/>`+
       `<text x="${cx}" y="${T+ph-Math.max(hp,ho)-6}" text-anchor="middle" style="fill:${a.p?(a.o/a.p*100>=S.meta?'#2ff5a0':a.o/a.p*100>=S.meta-10?'#ffc233':'#ff4d6d'):'var(--ink3)'};font-weight:700;font-size:11px">${a.p?Math.round(a.o/a.p*100)+'%':''}</text>`+
       `<text x="${cx}" y="${H-6}" text-anchor="middle">${d}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Visitas programadas y con adherencia por día">${g}</svg>`;
}
function svgLine(daily){

  const W=640,H=170,L=34,B=22,T=20,Rr=8,pw=W-L-Rr,ph=H-B-T;
  const X=d=>L+(all.indexOf(d)+.5)*pw/all.length,Y=v=>T+ph-ph*Math.min(100,v)/100;let g='';
  [0,25,50,75,100].forEach(v=>g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(130,150,230,.16)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);

  const pts=days.map(d=>[X(d),Y(daily[d].o/daily[d].p*100),d]);
  if(pts.length){g+=`<polygon points="${pts[0][0]},${Y(0)} ${pts.map(p=>p[0]+','+p[1]).join(' ')} ${pts.at(-1)[0]},${Y(0)}" fill="url(#gArea)"/>`+
   `<polyline class="glow" style="color:#25d9f5" fill="none" stroke="#25d9f5" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
   pts.forEach((p,i)=>{const a=daily[p[2]];g+=`<circle class="glow" style="color:#25d9f5" cx="${p[0]}" cy="${p[1]}" r="${i==pts.length-1?5.5:4}" fill="#06101f" stroke="#25d9f5" stroke-width="2.2" data-tip="${dlab(p[2])}: ${pc(a.o,a.p)} (${a.o} de ${a.p})"/>`+`<text x="${p[0]}" y="${p[1]+19}" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:11px">${(a.o/a.p*100).toFixed(1).replace(/\.0$/,'')}%</text>`})}
  all.forEach(d=>g+=`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${d}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumplimiento diario contra el objetivo">${g}</svg>`;
}

     <div class="card"><h2>Lectura por módulo</h2><div class="hint">Sobre ${fmt(t.okE)} visitas con adherencia y módulos cargados (hasta el ${D.meta.modLast} de oct). ${S.mode==='app'?'Rentas y Touch Point se exigen solo en PDV que registran el módulo.':'Se exigen los tres módulos siempre.'}</div>
       ${t.okE?'':'<div class="hint" style="color:var(--warn)">Este mes no tiene lecturas de módulos cargadas.</div>'}<div class="rows">${mods.map(m=>{const rd=m[1]-m[2];return hbar(m[0],m[1]?rd/m[1]:0,'acc',pc(rd,m[1])+' · '+fmt(m[2])+' pend.')}).join('')}
       ${hbar('Efectiva (todos)',t.okE?t.eff/t.okE:0,'good',pc(t.eff,t.okE)+' · '+fmt(t.okE-t.eff)+' inc.')}</div></div>
     <div class="card"><h2>Dónde se pierde la adherencia</h2><div class="hint">Conteo a la fecha de corte</div>
       <div class="rows">${lose('No realizadas',t.nr,'PDV programado sin visita ese día')}${lose('· en otra fecha',t.otra,'Programadas no realizadas con visita fuera de calendario')}${lose('Sin ID de cuenta',t.sinid,'No se pueden validar')}${lose('PDV sin ninguna visita',t.pdvSin,'Programados y nunca visitados')}${lose('Fuera de PDT: otra fecha',t.xd,'PDV de la ruta, fecha no programada')}${lose('Fuera de PDT: PDV ajeno',t.xf,'PDV no programado en la ruta')}</div></div>

  const gc=$('#goCrit');if(gc)gc.onclick=()=>{setTab('rutas');scrollTo(0,0)};

/* ---------- SPOC ---------- */
function spocCard(name,t,wide){
  const g=goalInfo(t),s=sem(g.cum);
  return `<div class="card spoc ${wide?'c12':'c6'}"><div style="display:flex;gap:14px;align-items:center;min-width:0">${ring(g.cum,COL[s[0]],S.meta,null,g.cum.toFixed(0)+'%','cumplimiento',112)}<div><div class="nm">${esc(name)}</div><div style="margin-top:6px">${pill(s[0],s[1],s[2])}</div></div></div>
   <div style="min-width:0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:8px"><span>Avance mensual <b class="num">${(g.avance*100).toFixed(1)}%</b></span><span class="num tc-${s[0]}">${g.cum.toFixed(1)}% vs ${S.meta}%</span></div>
   ${bar(g.avance,s[0],g.pace,S.meta/100)}
   <div class="kvs num"><span>Objetivo <b>${S.meta}%</b></span><span>Con adherencia <b>${fmt(t.ok)}</b></span><span>Meta de visitas <b>${fmt(g.metaV)}</b></span><span>Restantes <b>${fmt(g.rest)}</b></span><span>Programadas a la fecha <b>${fmt(t.prog)}</b></span><span>Efectivas <b>${pc(t.eff,t.okE)}</b></span></div></div></div>`;
}
function renderSpoc(){
  const sel=D.routes.map((_,i)=>i).filter(inSel);
  const by=D.spocs.map((n,i)=>({n,i,t:sum(sel.filter(r=>D.routes[r][1]==i).map(r=>C.R[r]))})).filter(x=>x.t.pm>0).sort((a,b)=>goalInfo(a.t).cum-goalInfo(b.t).cum);
  $('#p-spoc').innerHTML=`<div class="legend" style="margin:0 0 12px"><span style="--c:var(--good)">En meta: cumplimiento ≥ ${S.meta}%</span><span style="--c:var(--warn)">Atención: hasta 10 puntos debajo</span><span style="--c:var(--bad)">Rezago: más de 10 puntos debajo</span><span style="--c:var(--violet)">Marca violeta: ritmo esperado</span><span style="--c:#fff">Marca blanca: objetivo del mes</span></div>
  <div class="grid">${spocCard('General',sum(sel.map(i=>C.R[i])),true)}${by.map(x=>spocCard(tcase(x.n),x.t)).join('')}</div>`;
}

/* ---------- RUTAS ---------- */
function rowsFor(ru){return EV.filter(e=>e.ru==ru&&e.day<=S.cut).filter(e=>{const s=status(e)[0];return s!='efectiva'&&s!='sinmod'&&s!='just'}).sort((a,b)=>a.day-b.day)}
function chips(e){
  if((e.t==0&&!e.ok)||!evl(e)||e.just)return '<span class="chip na">—</span>';
  const c=(n,f,req)=>f?`<span class="chip ok">${n} ✓</span>`:req?`<span class="chip pend">${n} pendiente</span>`:`<span class="chip na">${n} n/a</span>`;
  return c('Frentes',e.F,1)+c('Rentas',e.R,S.mode==='all'||e.aR)+c('TP',e.T,S.mode==='all'||e.aT);
}
function detailRows(list,withRoute){
  return list.map(e=>{const s=status(e);return `<tr>${withRoute?`<td>${esc(D.routes[e.ru][0])}</td>`:''}<td class="num">${dlab(e.day)}</td><td>${esc(tcase(e.pdv))}</td><td>${pill(s[2],s[1],s[2]=='good'?'●':s[2]=='bad'?'■':s[2]=='warn'?'▲':'○')}${s[3]?`<div style="font-size:12px;color:var(--ink3)">${s[3]}</div>`:''}</td><td>${chips(e)}</td></tr>`}).join('');
}
function heat(L){
  const days=Array.from({length:S.cut},(_,i)=>i+1).filter(d=>L.some(x=>(C.rd[x.i]||{})[d]));
  if(!L.length)return '';
  let h=`<div class="heat" style="grid-template-columns:96px repeat(${days.length},38px)"><div></div>${days.map(d=>`<div class="hd">${d}</div>`).join('')}`;
  for(const x of L){h+=`<div class="rl">${esc(D.routes[x.i][0])}</div>`;
    for(const d of days){const c=(C.rd[x.i]||{})[d];
      if(!c){h+='<div class="cell e"></div>';continue}
      const p=c.o/c.p*100,col=p>=S.meta?'#2ff5a0':p>=S.meta-10?'#ffc233':'#ff4d6d';
      h+=`<div class="cell" style="background:${col};opacity:${p>=S.meta-10?1:.5+.5*(p/Math.max(1,S.meta-10))*0+.55+.45*(1-p/100)};box-shadow:0 0 8px ${col}66" data-tip="${esc(D.routes[x.i][0])} · ${dlab(d)}: ${c.o} de ${c.p} (${p.toFixed(0)}%)">${p.toFixed(0)}</div>`}}
  return h+'</div>';
}
function renderRutas(){
  const sel=D.routes.map((_,i)=>i).filter(inSel);
  let L=sel.map(i=>({i,t:C.R[i],g:goalInfo(C.R[i])})).filter(x=>x.t.prog>0);
  if(S.onlyLow)L=L.filter(x=>x.g.cum<S.meta);
  const sorters={pct:(a,b)=>a.g.cum-b.g.cum,sin:(a,b)=>(b.t.prog-b.t.ok)-(a.t.prog-a.t.ok),av:(a,b)=>a.g.avance-b.g.avance,pend:(a,b)=>(b.t.pF+b.t.pR+b.t.pT)-(a.t.pF+a.t.pR+a.t.pT)};
  L.sort(sorters[S.sort]);
  $('#p-rutas').innerHTML=`<div class="toolbar">
    <div class="f"><label for="rLow">Mostrar</label><select id="rLow"><option value="1" ${S.onlyLow?'selected':''}>Solo rutas bajo el objetivo</option><option value="0" ${S.onlyLow?'':'selected'}>Todas las rutas</option></select></div>
    <div class="f"><label for="rSort">Ordenar por</label><select id="rSort"><option value="pct" ${S.sort=='pct'?'selected':''}>Menor adherencia</option><option value="sin" ${S.sort=='sin'?'selected':''}>Más visitas sin adherencia</option><option value="av" ${S.sort=='av'?'selected':''}>Menor avance mensual</option><option value="pend" ${S.sort=='pend'?'selected':''}>Más lecturas faltantes</option></select></div>
    <div style="color:var(--ink2);font-size:13px;align-self:center">${L.length} rutas. Toca una fila para ver PDV y fechas.</div></div>
  <div class="grid"><div class="card c12"><h2>Mapa de calor: adherencia por ruta y día</h2><div class="hint">Cada celda es el % de visitas con adherencia ese día. Verde: en meta. Ámbar: hasta 10 puntos debajo. Rojo: rezago.</div><div class="tscroll" style="max-height:420px;overflow:auto">${heat(L)||'<div style="color:var(--ink2)">Sin rutas para mostrar.</div>'}</div></div>
  <div class="card c12"><div class="tscroll"><table><thead><tr><th>Ruta</th><th>SPOC</th><th class="r">Programadas</th><th class="r">Con adherencia</th><th class="r">% adh.</th><th class="r">Sin adh.</th><th class="r">Fuera de PDT</th><th class="r">Falta Frentes</th><th class="r">Falta Rentas</th><th class="r">Falta TP</th><th>Avance mensual</th><th>Estado</th></tr></thead><tbody>
  ${L.map(x=>{const t=x.t,s=sem(x.g.cum);return `<tr class="click" tabindex="0" data-ru="${x.i}"><td style="white-space:nowrap"><b>${esc(D.routes[x.i][0])}</b><div style="font-size:11px;color:var(--ink3)">${esc(tcase(D.routes[x.i][2]))}</div></td><td style="white-space:nowrap">${esc(tcase(D.spocs[D.routes[x.i][1]]))}</td><td class="r num">${t.prog}</td><td class="r num">${t.ok}</td><td class="r num tc-${s[0]}"><b>${x.g.cum.toFixed(1)}%</b></td><td class="r num">${t.prog-t.ok}</td><td class="r num">${t.xd+t.xf}</td><td class="r num">${t.pF}</td><td class="r num">${t.pR}</td><td class="r num">${t.pT}</td><td style="min-width:160px"><div style="display:flex;gap:8px;align-items:center">${bar(x.g.avance,s[0],x.g.pace,S.meta/100)}<span class="num">${(x.g.avance*100).toFixed(0)}%</span></div></td><td>${pill(s[0],s[1],s[2])}</td></tr>`}).join('')||'<tr><td colspan="12" style="padding:20px;color:var(--ink2)">Ninguna ruta bajo el objetivo con estos filtros.</td></tr>'}
  </tbody></table></div></div></div>`;
  $('#rLow').onchange=e=>{S.onlyLow=e.target.value=='1';renderRutas()};
  $('#rSort').onchange=e=>{S.sort=e.target.value;renderRutas()};
  document.querySelectorAll('#p-rutas tr.click').forEach(tr=>{
    const go=()=>{const nx=tr.nextElementSibling;if(nx&&nx.classList.contains('sub')){nx.remove();return}
      const ru=+tr.dataset.ru,rows=rowsFor(ru),sub=document.createElement('tr');sub.className='sub';
      sub.innerHTML=`<td colspan="12"><b>${esc(D.routes[ru][0])}</b>: ${rows.length} registros por atender (PDV sin visita, visitas fuera de PDT y visitas con módulos pendientes)
      <div class="tscroll" style="margin-top:8px;max-height:340px"><table><thead><tr><th>Fecha</th><th>PDV</th><th>Estatus</th><th>Módulos</th></tr></thead><tbody>${detailRows(rows,false)}</tbody></table></div></td>`;
      tr.after(sub)};
    tr.onclick=go;tr.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();go()}};
  });
}

/* ---------- DETALLE ---------- */
function detList(){
  const q=S.dq.trim().toLowerCase();
  return EV.filter(e=>e.day<=S.cut&&inSel(e.ru)).filter(e=>{
    const st=status(e)[0];if(S.dst!='all'&&st!=S.dst)return false;
    if(q&&!(e.pdv.toLowerCase().includes(q)||D.routes[e.ru][0].toLowerCase().includes(q)||D.spocs[e.sp].toLowerCase().includes(q)))return false;return true;
  }).sort((a,b)=>b.day-a.day||D.routes[a.ru][0].localeCompare(D.routes[b.ru][0]));
}
function renderDet(){
  const L=detList(),shown=L.slice(0,S.dmax);
  const opt=(v,l)=>`<option value="${v}" ${S.dst==v?'selected':''}>${l}</option>`;
  $('#p-det').innerHTML=`<div class="toolbar">
    <div class="f"><label for="dSt">Estatus</label><select id="dSt">${opt('all','Todos')}${opt('efectiva','Efectiva')}${opt('incompleta','Adherente, faltan módulos')}${opt('sinmod','Adherente, módulos sin cargar')}${opt('just','Justificada')}${opt('noreal','No realizada')}${opt('sinid','Sin ID de cuenta')}${opt('fuera','Fuera de PDT')}</select></div>
    <div class="f" style="flex:1;min-width:200px"><label for="dQ">Buscar PDV, ruta o SPOC</label><input type="search" id="dQ" value="${esc(S.dq)}" placeholder="Ej. Walmart, RUTA 11"></div>
    <button class="btn" id="dCopy">Copiar como CSV</button><span id="dMsg" style="font-size:12px;color:var(--ink2);align-self:center"></span></div>
  <div class="card"><div style="color:var(--ink2);font-size:13px;margin-bottom:8px">${fmt(L.length)} registros hasta el ${dlab(S.cut)}${L.length>shown.length?`; se muestran ${shown.length}`:''}.</div>
  <div class="tscroll" style="max-height:640px;overflow:auto"><table><thead><tr><th>Ruta</th><th>Fecha</th><th>PDV</th><th>Estatus</th><th>Módulos</th></tr></thead><tbody>${detailRows(shown,true)}</tbody></table></div>
  ${L.length>shown.length?'<p><button class="btn" id="dMore">Mostrar 150 más</button></p>':''}</div>`;
  $('#dSt').onchange=e=>{S.dst=e.target.value;S.dmax=150;renderDet()};
  $('#dQ').oninput=e=>{S.dq=e.target.value;S.dmax=150;renderDet();const i=$('#dQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  const m=$('#dMore');if(m)m.onclick=()=>{S.dmax+=150;renderDet()};
  $('#dCopy').onclick=async()=>{
    const head='Ruta,SPOC,Fecha,PDV,Estatus,Frentes,Rentas,TouchPoint';
    const csv=[head].concat(L.map(e=>{const s=status(e),v=(f,r)=>((e.t==0&&!e.ok)||!evl(e)||e.just)?'':f?'Con lectura':r?'Pendiente':'No aplica';
      return [D.routes[e.ru][0],tcase(D.spocs[e.sp]),D.meta.y+'-'+String(D.meta.m).padStart(2,'0')+'-'+String(e.day).padStart(2,'0'),tcase(e.pdv),s[1]+(s[3]?' ('+s[3]+')':''),v(e.F,1),v(e.R,S.mode=='all'||e.aR),v(e.T,S.mode=='all'||e.aT)].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')})).join('\n');
    try{await navigator.clipboard.writeText(csv);$('#dMsg').textContent='CSV copiado.'}catch(err){$('#dMsg').textContent='No se pudo copiar desde esta vista.'}};
}


/* ---------- CALIDAD DE VISITA ---------- */
const QT={1:['Check-out otro día','Check-in en una fecha y check-out en otra (hora local)'],2:['Doble visita propia','Mismo visitante, mismo ID de cuenta (PDV), mismo día (no cuenta Back Up contra ruta normal)'],3:['DPP más de 3 h','Visita a PDV de canal DPP con duración mayor a 3 horas'],4:['HSM más de 4 h','Visita a PDV de canal HSM con duración mayor a 4 horas'],5:['Abandonada','Visita con estatus «Abandonada» en MapPHC'],6:['Menos de 30 min','Visita con duración menor a 30 minutos']};
const qHrs=h=>{const m=Math.round(h*60);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const qVal=r=>r.t==6?r.val+' min':r.t==2?r.val+' visitas':qHrs(r.val);
function qList(){return (D.q||[]).filter(a=>a[3]<=S.cut&&(a[1]<0?(S.spoc<0&&S.ruta<0):inSel(a[1]))).map(a=>({t:a[0],ru:a[1],pdv:D.pdvs[a[2]],day:a[3],val:a[4],det:a[5]}))}
const qSp=r=>r.ru<0?'Sin ruta en PDT':tcase(D.spocs[D.routes[r.ru][1]]);
const qRu=r=>r.ru<0?'—':D.routes[r.ru][0];
function renderCal(){

  const totV=EV.filter(e=>e.day<=S.cut&&inSel(e.ru)&&(e.ok||e.t==1)).length;
  const cnt={},rutas={};for(const r of all){cnt[r.t]=(cnt[r.t]||0)+1;(rutas[r.t]||(rutas[r.t]=new Set())).add(r.ru)}

    return `<button class="kpi qtile${on?' on':''}" data-qt="${t}" style="text-align:left;cursor:pointer;font:inherit;color:inherit;background:rgba(77,141,255,.08);border:1px solid rgba(130,150,230,.25);border-radius:12px;padding:12px 14px;${on?'outline:2px solid var(--cyan)':''}"><div class="l">${QT[t][0]}</div><div class="v num ${n?'p':'g'}" style="font-size:30px">${fmt(n)}</div><div class="s num">${n?pc(n,totV)+' de las visitas · '+rutas[t].size+' rutas':'Sin casos'}</div></button>`}).join('');
  const bySp={},byRu={};
  for(const r of all){const sk=qSp(r),a=bySp[sk]||(bySp[sk]={n:sk,c:{},tot:0});a.c[r.t]=(a.c[r.t]||0)+1;a.tot++;
    const b=byRu[r.ru]||(byRu[r.ru]={ru:r.ru,c:{},tot:0});b.c[r.t]=(b.c[r.t]||0)+1;b.tot++}
  const cell=(c,t)=>`<td class="r num">${c[t]?'<b>'+c[t]+'</b>':'<span style="color:var(--ink3)">·</span>'}</td>`;
  const heads=[1,2,3,4,5,6].map(t=>`<th class="r">${QT[t][0]}</th>`).join('');
  const spRows=Object.values(bySp).sort((a,b)=>b.tot-a.tot),ruRows=Object.values(byRu).sort((a,b)=>b.tot-a.tot);
  const list=all.filter(r=>!S.qt||r.t==S.qt).sort((a,b)=>b.day-a.day||qRu(a).localeCompare(qRu(b))),shown=list.slice(0,S.qmax);
  el.innerHTML=`<div class="grid">
   <div class="card c12"><h2>Calidad de visita</h2><div class="hint">Incidencias de las visitas registradas hasta el ${dlab(S.cut)} (${fmt(totV)} visitas). Toca un indicador para filtrar el detalle. Check-in: hora de inicio de la visita; check-out: hora de cierre real. Las horas del monitor se ajustan restando 6 h (hora local).</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:10px">${tiles}</div>
    ${cnt[5]?'':'<div class="hint" style="margin-top:10px">Abandonadas: el monitor no trae ninguna visita con estatus «Abandonada» (solo «Completed» y «Closed - syncing»).</div>'}${cnt[2]?'':'<div class="hint" style="margin-top:10px">Doble visita propia: no hay casos. Las visitas Back Up (MR_BK) que coinciden con la ruta normal no se cuentan.</div>'}
    ${(D.meta.sinCanal?`<div class="hint" style="margin-top:6px">${D.meta.sinCanal} PDV visitados no tienen canal en el PDT; no se pueden evaluar para DPP/HSM.</div>`:'')}</div>
   <div class="card c12"><h2>Por SPOC</h2><div class="tscroll" style="max-height:380px;overflow:auto"><table><thead><tr><th>SPOC</th>${heads}<th class="r">Total</th></tr></thead><tbody>${spRows.map(x=>`<tr><td style="white-space:nowrap">${esc(x.n)}</td>${[1,2,3,4,5,6].map(t=>cell(x.c,t)).join('')}<td class="r num"><b>${x.tot}</b></td></tr>`).join('')||'<tr><td colspan="8" style="padding:14px;color:var(--ink2)">Sin incidencias.</td></tr>'}</tbody></table></div></div>
   <div class="card c12"><h2>Por ruta</h2><div class="hint">De la ruta con más incidencias a la que menos.</div><div class="tscroll" style="max-height:380px;overflow:auto"><table><thead><tr><th>Ruta</th><th>SPOC</th>${heads}<th class="r">Total</th></tr></thead><tbody>${ruRows.map(x=>`<tr><td style="white-space:nowrap"><b>${x.ru<0?'—':esc(D.routes[x.ru][0])}</b></td><td style="white-space:nowrap">${x.ru<0?'Sin ruta en PDT':esc(tcase(D.spocs[D.routes[x.ru][1]]))}</td>${[1,2,3,4,5,6].map(t=>cell(x.c,t)).join('')}<td class="r num"><b>${x.tot}</b></td></tr>`).join('')||'<tr><td colspan="9" style="padding:14px;color:var(--ink2)">Sin incidencias.</td></tr>'}</tbody></table></div></div>
   <div class="card c12"><div class="toolbar"><div class="f"><label for="qSel">Incidencia</label><select id="qSel"><option value="0">Todas</option>${[1,2,3,4,5,6].map(t=>`<option value="${t}" ${S.qt==t?'selected':''}>${QT[t][0]}</option>`).join('')}</select></div><button class="btn" id="qCopy">Copiar como CSV</button><span id="qMsg" style="font-size:12px;color:var(--ink2);align-self:center"></span></div>

  for(let i=0;i<qC.length;i++)await db.doc('chunks/'+k+'-q'+i).set({rows:qC[i]});
  UP.vs[k]=v;
  await ref.set({v,updatedAt:new Date().toISOString(),dmeta:N.meta,routes:N.routes,spocs:N.spocs,nEv:evC.length,nPdv:pdC.length,nQ:qC.length});
  if(prev){for(let i=evC.length;i<(prev.nEv||0);i++)try{await db.doc('chunks/'+k+'-ev'+i).delete()}catch(e){}
    for(let i=pdC.length;i<(prev.nPdv||0);i++)try{await db.doc('chunks/'+k+'-pdv'+i).delete()}catch(e){}
    for(let i=qC.length;i<(prev.nQ||0);i++)try{await db.doc('chunks/'+k+'-q'+i).delete()}catch(e){}}
  return true;
}
async function loadMonth(k,m){
  if(!m||UP.vs[k]===m.v)return;UP.vs[k]=m.v;
  try{const ev=[],pdvs=[],q=[];
    for(let i=0;i<m.nEv;i++){const x=await UP.db.doc('chunks/'+k+'-ev'+i).get();if(!x.exists)return;ev.push(...x.data().rows)}
    for(let i=0;i<m.nPdv;i++){const x=await UP.db.doc('chunks/'+k+'-pdv'+i).get();if(!x.exists)return;pdvs.push(...x.data().rows)}
    for(let i=0;i<(m.nQ||0);i++){const x=await UP.db.doc('chunks/'+k+'-q'+i).get();if(!x.exists)return;q.push(...x.data().rows)}
    const nd={meta:m.dmeta,routes:m.routes,spocs:m.spocs,pdvs,ev,q};MONTHS[k]=nd;
    UP.info=new Date(m.updatedAt).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});
    if(k>=mkey(D.meta))setData(nd);else fillSelects();
  }catch(err){UP.vs[k]=null}
}
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const user=await claude.use('user');UP.canWrite=user?await user.canEdit():false;
    UP.db=await claude.use('db');
    if(UP.db){
      UP.db.collection('months').onSnapshot(snap=>{snap.docs.forEach(x=>{if(!x.exists)return;if(x.id==='sup'){SUP=x.data().rows||SUP;render();return}loadMonth(x.id,x.data())})},()=>{});
      if(!UP.canWrite){$('#tabUpl').hidden=true;if(S.tab=='upl')setTab('res')}
    }
  }catch(e){}
})();
renderUpl();

</script>
